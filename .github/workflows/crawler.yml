name: Daily Crawler

on:
  schedule:
    - cron: '0 15 * * *' # JST 0:00（UTC 15:00）
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ハング時に360分(既定)課金される事故の防止
    steps:
      # 2026-07 に FLY_API_TOKEN が空のまま3日毎日失敗→60日ルールで自動停止した。
      # 空トークンは flyctl の generic エラーに化けて原因特定に時間がかかるため先に落とす
      - name: Fail fast if FLY_API_TOKEN secret is missing
        env:
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret が未設定/空です。fly tokens create deploy -a himadan-archive -x 87600h で再発行して Settings > Secrets に登録してください"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run diff crawler on Fly.io
        run: flyctl ssh console --app himadan-archive -C "node dist/crawler/run-diff.js"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Slack側のエラー通知 (notify.ts) は SLACK_BOT_TOKEN が死ぬと一緒に沈黙する
      # (2026-05-14〜08-04 に実際に2.7ヶ月無音で止まった)。GitHub Issue は Slack 非依存なので
      # ここで可視化する。honnemaru の番人 (watchdog) は毎朝この workflow の直近 run が
      # failure かを見て Webhook 経路 (Bot Token 非依存) で Slack に届ける = 経路が分離される。
      # ※番人が Slack に流すのは run の失敗であって Issue ではない (Issue はリポジトリ側の可視化)
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // ⚠️ このリポジトリは Issues 機能が無効なため、API は
            // "Issues has been disabled in this repository" で必ず落ちる。
            // Issue はあくまで「リポジトリ側の可視化」であって主経路ではない
            // (失敗の通知は番人が run の失敗を見て Slack に流す) ので、
            // ここで落として Unhandled error を出す価値は無い。無効なら黙って抜ける。
            // 2026-08-19〜21 の失敗ログはこの Unhandled error で終わっており、
            // 本当の原因 (thread_not_found) が読み取りにくくなっていた。
            const { data: repoInfo } = await github.rest.repos.get({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            if (!repoInfo.has_issues) {
              core.warning('このリポジトリは Issues が無効なため Issue 作成をスキップします（通知は番人経由）');
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const PREFIX = '[crawler-failure] Daily Crawler が失敗';
            // 重複判定はラベルではなくタイトル前方一致で行う。ラベルが未作成のリポでも
            // 確実に効かせるため (エスカレーション自体がラベルの存在に依存すると本末転倒)
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            if (issues.some(i => i.title.startsWith(PREFIX))) {
              core.info('既存の crawler-failure Issue が open のため新規作成しません');
              return;
            }
            const payload = {
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${PREFIX} (${new Date().toISOString().slice(0,10)})`,
              body: [
                '## Daily Crawler が失敗しました',
                '',
                `**workflow run**: ${runUrl}`,
                '',
                '⚠️ 放置すると Slack 無料プランの90日で古いメッセージから順に回収不能になります。',
                '2026-05〜08 の事故では残り9日で間に合いました。',
                '',
                '### 想定原因 (2026-08 の実績順)',
                '- `SLACK_BOT_TOKEN` (Fly側 secret) の失効 → `invalid_auth`。Slack App を Reinstall して `fly secrets set SLACK_BOT_TOKEN=... -a himadan-archive`',
                '- `FLY_API_TOKEN` (GitHub側 secret) の失効/空 → `fly tokens create deploy -a himadan-archive -x 87600h` で再発行',
                '- Fly マシン停止 → `fly status -a himadan-archive`',
              ].join('\n'),
            };
            // ラベルは付けられれば付ける。無いリポで create ごと落とさないよう分離する
            try {
              await github.rest.issues.create({ ...payload, labels: ['crawler-failure'] });
            } catch (e) {
              core.warning(`ラベル付きの作成に失敗したためラベル無しで作成します: ${e.message}`);
              await github.rest.issues.create(payload);
            }
